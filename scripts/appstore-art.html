<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>appstore-art</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&display=block" rel="stylesheet">
<style>
  /* App Store のプロダクトページのヘッダ（21:9、3840×1646）と検索結果（3:2、2880×1920）。
     make-appstore-art.mjs が画面なしの Edge で写す。設定は URL の # に JSON で渡る。
     ヘッダ: 左半分に名前と一言、右半分に実際の画面。どちらもそれぞれの側の真ん中に置く。
     検索結果: 名前はアイコンの横に出るので一言だけ。縦の画面は右、横の画面は下に置く */
  html, body { margin: 0; overflow: hidden; }
  .g { position: relative; overflow: hidden; font-family: "Noto Sans JP", "Yu Gothic UI", sans-serif; }
  .text { position: absolute; display: flex; flex-direction: column; justify-content: center; align-items: center; }
  .inner { display: flex; flex-direction: column; }
  .name { font-weight: 900; line-height: 1.1; white-space: nowrap; letter-spacing: 0.01em; }
  .tag { white-space: pre; }
  .shot { position: absolute; overflow: hidden; box-shadow: 0 40px 120px rgba(0, 0, 0, 0.35); }
  .shot img { position: absolute; left: 0; width: 100%; display: block; }

  .header { width: 3840px; height: 1646px; }
  .header .text { left: 0; top: 0; width: 1920px; height: 1646px; }
  .header .inner { gap: 80px; }
  .header .name { font-size: 260px; }
  .header .tag { font-weight: 700; font-size: 116px; line-height: 1.4; }

  .search { width: 2880px; height: 1920px; }
  .search .tag { font-weight: 900; font-size: 150px; line-height: 1.3; }
</style>
</head>
<body>
<div class="g" id="g">
  <div class="text"><div class="inner"><div class="name" id="name"></div><div class="tag" id="tag"></div></div></div>
</div>
<script>
// 設定の形は make-appstore-art.mjs の頭を見る
const c = JSON.parse(decodeURIComponent(location.hash.slice(1)));
const g = document.getElementById('g');
g.classList.add(c.kind);
g.style.background = c.colors.bg;
document.documentElement.lang = c.lang;
const nameEl = document.getElementById('name');
const tagEl = document.getElementById('tag');
nameEl.textContent = c.name;
nameEl.style.color = c.colors.name;
tagEl.textContent = c.tag;
tagEl.style.color = c.colors.tag;
if (c.kind === 'search') nameEl.remove();

const W = c.kind === 'header' ? 3840 : 2880;
const H = c.kind === 'header' ? 1646 : 1920;
const landscape = c.screens.some((s) => s.landscape);

// 画面を置く。縦の画面は下へはみ出させ、上だけ切る（ステータスバーを落とす）
function placeShots(boxes) {
  return c.screens.map((s, i) => {
    const b = boxes[i];
    const div = document.createElement('div');
    div.className = 'shot';
    Object.assign(div.style, { left: b.x + 'px', top: b.y + 'px', width: b.w + 'px', height: b.h + 'px', borderRadius: b.r + 'px' });
    const img = new Image();
    img.src = s.src;
    div.appendChild(img);
    g.appendChild(div);
    return img.decode().then(() => {
      const h = (b.w / img.naturalWidth) * img.naturalHeight;
      img.style.top = -(s.top || 0) * h + 'px';
    });
  });
}

let text; // 字のかたまりの枠
let boxes;
if (c.kind === 'header') {
  text = { x: 0, y: 0, w: 1920, h: H };
  if (landscape) {
    const w = 1760, h = Math.round(w / c.screens[0].aspect);
    boxes = [{ x: 2880 - w / 2, y: (H - h) / 2, w, h, r: 40 }];
  } else {
    const n = c.screens.length, w = n === 1 ? 900 : 720, gap = 100;
    const total = n * w + (n - 1) * gap;
    boxes = c.screens.map((s, i) => ({ x: 2880 - total / 2 + i * (w + gap), y: 220, w, h: H, r: 64 }));
  }
} else if (landscape) {
  const w = 2500, h = Math.round(w / c.screens[0].aspect);
  boxes = [{ x: (W - w) / 2, y: H - h - 170, w, h, r: 40 }];
  text = { x: 0, y: 0, w: W, h: H - h - 170 };
} else {
  const w = 960;
  boxes = [{ x: 2140 - w / 2, y: 200, w, h: H, r: 80 }];
  text = { x: 0, y: 0, w: 1560, h: H };
}
const textEl = document.querySelector('.text');
Object.assign(textEl.style, { left: text.x + 'px', top: text.y + 'px', width: text.w + 'px', height: text.h + 'px' });

// 枠の 72% を超える字は縮める（端が切られても字が残るように）
function fit(el, max) {
  if (!el.isConnected) return;
  const size = parseFloat(getComputedStyle(el).fontSize);
  if (el.scrollWidth > max) el.style.fontSize = Math.floor(size * max / el.scrollWidth) + 'px';
}
Promise.all([document.fonts.ready, ...placeShots(boxes)]).then(() => {
  fit(nameEl, text.w * 0.72);
  fit(tagEl, text.w * 0.72);
  document.title = 'ready';
});
</script>
</body>
</html>
