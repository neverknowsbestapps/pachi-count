<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>パチカウント アイコン変換</title>
  <style>
    body { font-family: sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 20px; }
    .card { border: 1px solid #ddd; border-radius: 12px; padding: 20px; margin: 20px 0; }
    canvas { width: 180px; height: 180px; border: 1px solid #ccc; border-radius: 8px; }
    button { margin-top: 12px; padding: 10px 18px; font-size: 14px; border: 0;
             border-radius: 8px; background: #0066FF; color: #fff; cursor: pointer; }
    .note { font-size: 13px; color: #666; }
  </style>
</head>
<body>
  <h1>パチカウント アイコン → PNG 変換</h1>
  <p class="note">このファイルをダブルクリックでブラウザで開き、各ボタンを押すと 1024×1024 の PNG がダウンロードされます。<br>
  ダウンロードした2つのファイルを <b>assets フォルダ</b> に入れてください（同名で上書き）。</p>

  <div class="card">
    <h2>1. icon.png（メイン・iOS/汎用）</h2>
    <canvas id="c1" width="1024" height="1024"></canvas><br>
    <button onclick="dl('c1','icon.png')">icon.png をダウンロード</button>
  </div>

  <div class="card">
    <h2>2. icon-foreground.png（Android用・背景透過）</h2>
    <canvas id="c2" width="1024" height="1024" style="background:#eee"></canvas><br>
    <button onclick="dl('c2','icon-foreground.png')">icon-foreground.png をダウンロード</button>
  </div>

  <script>
    var iconSvg = '<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">'
      + '<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">'
      + '<stop offset="0" stop-color="#4CC9F0"/><stop offset="1" stop-color="#0066FF"/></linearGradient></defs>'
      + '<rect width="1024" height="1024" rx="200" fill="#12203A"/>'
      + '<text x="512" y="512" font-family="Verdana, Geneva, sans-serif" font-weight="bold" font-size="680"'
      + ' fill="url(#g)" text-anchor="middle" dominant-baseline="central">P</text></svg>';

    var fgSvg = '<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">'
      + '<defs><linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">'
      + '<stop offset="0" stop-color="#4CC9F0"/><stop offset="1" stop-color="#0066FF"/></linearGradient></defs>'
      + '<text x="512" y="512" font-family="Verdana, Geneva, sans-serif" font-weight="bold" font-size="540"'
      + ' fill="url(#g2)" text-anchor="middle" dominant-baseline="central">P</text></svg>';

    function draw(id, svg) {
      var canvas = document.getElementById(id);
      var ctx = canvas.getContext('2d');
      var img = new Image();
      img.onload = function () { ctx.clearRect(0, 0, 1024, 1024); ctx.drawImage(img, 0, 0, 1024, 1024); };
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    }
    function dl(id, filename) {
      var link = document.createElement('a');
      link.download = filename;
      link.href = document.getElementById(id).toDataURL('image/png');
      link.click();
    }
    draw('c1', iconSvg);
    draw('c2', fgSvg);
  </script>
</body>
</html>
